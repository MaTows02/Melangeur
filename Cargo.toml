[package]
name = "melangeur"
version = "1.0.1"
edition = "2024"
description = "Mélangeur de volume par application et par onglet pour Windows"
authors = ["MaTows"]
license-file = "LICENSE.txt"
repository = "https://github.com/MaTows02/Melangeur"
publish = false

[dependencies]
serde_json = "1.0.154"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_Security", "Win32_System_Ole", "Win32_Media_Audio_Endpoints", "Win32_Devices_FunctionDiscovery", "Win32_UI_Shell_PropertiesSystem", "Win32_Storage_Packaging_Appx", "Win32_Devices_Properties", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Diagnostics_ToolHelp"] }
windows-core = "0.62"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
embed-resource = "3.0.12"
